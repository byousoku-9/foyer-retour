# FR44 d — L'intégration continue : le lint et la suite hors ligne, sur chaque pull request.
#
# Ce fichier est aussi appelé par `deploy.yml` (`workflow_call`) : les mêmes commandes gardent la
# porte des deux côtés, et il n'existe qu'**un** texte qui dise ce que « vert » veut dire. Deux
# copies auraient divergé au premier réglage, et c'est exactement le « deux textes faisant autorité »
# que la convention Seuils du spine interdit.
#
# **Ce qui n'est pas ici, et pourquoi.** Pas d'évals : elles coûtent, exigent la clé et n'ont de sens
# qu'en sous-ensemble rapide — story 4.1 (AD-14). Pas de déploiement : une pull request ne touche
# jamais le service (AD-12, « les PR exécutent tests sans déployer »).
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      sources_reelles:
        description: Régénérer les artefacts depuis les PDF authentifiés avant les tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Le provider GCP refuse toute référence autre que `refs/heads/main`. Sur PR, aucune étape
  # d'authentification ne tourne ; lors de l'appel réutilisable du déploiement, ce droit permet au
  # seul lecteur de sources d'échanger le jeton OIDC court dont `fetch_source` a besoin.
  id-token: write

jobs:
  verifier:
    name: Lint et suite hors ligne
    runs-on: ubuntu-latest
    # La suite tient en une quinzaine de secondes ; le reste est de l'installation. Au-delà, quelque
    # chose attend ce qui ne viendra pas — mieux vaut le dire que d'occuper un runner une heure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # uv épinglé sur la même série que le `Dockerfile` (`ghcr.io/astral-sh/uv:0.11`) : la CI et
      # l'image de production résolvent le même `uv.lock` avec le même résolveur.
      - name: Installer uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          # L'installateur dépose `uv` dans `~/.local/bin`, que le runner n'a pas forcément sur son
          # `PATH` : le dire explicitement plutôt que de compter sur l'image.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `node` est **épinglé**, comme `uv`. Avec `FRONT_TESTS_REQUIS=1`, 130 cas de front dépendent
      # de lui : s'en remettre à la version que l'image du runner embarque, c'est laisser GitHub
      # choisir le moteur qui exécute la moitié de nos assertions, et le changer sans prévenir. Les
      # harnais de `tests/js/` n'utilisent que `node:vm`, `node:fs`, `node:path` et `node:url`.
      - name: Installer node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `--frozen` : le lock fait foi. Une dépendance ajoutée sans relancer `uv lock` fait échouer la
      # CI au lieu de résoudre autre chose que ce que l'image construira.
      - name: Installer les dépendances (lock gelé)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check server tests scripts

      - name: Contrôler l'identité du lecteur de sources
        if: inputs.sources_reelles
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          SOURCE_READER_SA: ${{ vars.SOURCE_READER_SA }}
          WIF_PROVIDER_ATTENDU: projects/1061254857807/locations/global/workloadIdentityPools/github/providers/foyer-retour
          SOURCE_READER_SA_ATTENDU: source-reader@foyer-retour.iam.gserviceaccount.com
        run: |
          [ -n "$WIF_PROVIDER" ] || { echo "variable WIF_PROVIDER absente" >&2; exit 1; }
          [ -n "$SOURCE_READER_SA" ] || { echo "variable SOURCE_READER_SA absente" >&2; exit 1; }
          [ "$WIF_PROVIDER" = "$WIF_PROVIDER_ATTENDU" ] || {
            echo "WIF_PROVIDER ne désigne pas le provider borné à ce dépôt et à main" >&2
            exit 1
          }
          [ "$SOURCE_READER_SA" = "$SOURCE_READER_SA_ATTENDU" ] || {
            echo "SOURCE_READER_SA ne désigne pas le lecteur dédié sans droit de déploiement" >&2
            exit 1
          }

      # Cette branche n'existe que dans l'appel réutilisable de `deploy.yml`, depuis `main`. Le
      # compte dédié n'a aucun droit de projet ni de déploiement : il peut seulement lire les objets
      # de `gs://foyer-retour-sources`. `create_credentials_file: false` évite de déposer un
      # `gha-creds-*.json` ; l'access token court reste une sortie de cette étape.
      - name: Identité fédérée du lecteur de sources (sans clé)
        id: auth_sources
        if: inputs.sources_reelles
        # v3 vérifié : le SHA évite qu'un tag mutable change le courtier d'identité sans revue.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SOURCE_READER_SA }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false

      # Le jeton n'est transmis qu'à ce processus. La porte `main` lit directement les deux objets
      # privés : elle ne dépend donc plus du comportement régional des frontaux publics. Le SHA
      # committé reste l'autorité : tout octet divergent échoue avant écriture et avant `pytest`.
      - name: Télécharger les sources réelles (empreinte vérifiée)
        if: inputs.sources_reelles
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth_sources.outputs.access_token }}
        run: uv run python -m server.ingest.fetch_source --all --private-source

      - name: Prouver la régénération des deux PDF réels
        if: inputs.sources_reelles
        env:
          REAL_PDF_TESTS_REQUIRED: '1'
        run: >-
          uv run pytest -q
          tests/test_parsing_axa.py::test_real_pdf_regenerates_committed_artefacts
          tests/test_parsing_baloise.py::test_real_baloise_pdf_regenerates_the_committed_structural_identity

      # `ANTHROPIC_API_KEY=` : la suite doit passer **sans** clé (AD-14) — les fixtures LLM sont
      # enregistrées, et un test qui sortirait sur le réseau échouerait ici plutôt qu'en silence.
      #
      # `FRONT_TESTS_REQUIS=1` : sans elle, l'absence de `node` fait passer **130** cas de front en
      # `skip` — 42 pour le guide, 88 pour le sinistre — et un `skip` est indiscernable d'un succès
      # dans un `pytest -q`. La variable transforme la disparition de `node` en échec plutôt qu'en
      # silence (reprise différée de 1.7 et 1.9).
      - name: Tests unitaires, sans réseau, front compris
        env:
          ANTHROPIC_API_KEY: ''
          FRONT_TESTS_REQUIS: '1'
        run: uv run pytest -q
