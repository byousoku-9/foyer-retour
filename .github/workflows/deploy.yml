# FR44 a–c / AD-12 — Le déploiement sur Cloud Run depuis `main`, avec les smoke tests devant.
#
# **L'ordre est la garantie.** La révision est construite par Cloud Build depuis `--source`, déployée
# **sans trafic** sous le tag `candidat`, sondée par `scripts/smoke.py` sur son URL taguée — et le
# trafic n'est promu qu'ensuite, **nommément vers cette révision-là**. AD-12 exige les smokes « avant
# promotion du trafic » : sans `no_traffic`, la nouvelle révision aurait déjà servi des requêtes
# réelles au moment où on la sonde. Le tag donne une URL propre (`https://candidat---<hôte du
# service>`) qui n'atteint que la révision candidate — et c'est **elle** que `deploy-cloudrun@v3`
# publie en sortie `url` dès que l'entrée `tag` est posée (son analyseur prend l'entrée de
# `status.traffic[]` portant le tag ; sans tag, il rendrait `status.url`, celle du service).
#
# Effet de bord assumé : pendant le smoke, deux révisions coexistent, chacune avec son propre
# `--max-instances=1`. Le pic est donc de deux instances, pour la durée des quatre vérifications.
#
# **Retour arrière** (README, § Déploiement) :
#   gcloud run revisions list --service=foyer-retour --region=europe-west1 --project=foyer-retour
#   gcloud run services update-traffic foyer-retour --to-revisions=<révision>=100 \
#     --region=europe-west1 --project=foyer-retour
name: Déploiement Cloud Run

on:
  push:
    branches: [main]
  # Relancer un déploiement, ou re-sonder le service, sans avoir à pousser un commit pour cela.
  # **Le bouton de GitHub laisse choisir la branche** : sans la garde `if:` posée sur le job
  # `deployer` plus bas, un `Run workflow` sur une branche de travail construirait et promouvrait ce
  # code en production. Le déclencheur ne relâche donc rien parce que la garde est là, pas parce que
  # GitHub le restreint : la seule référence que `deploy.yml` déploie est `main`, et le workflow
  # re-joue lint, suite, build et smokes à l'identique.
  workflow_dispatch:

# `id-token: write` est ce qui permet à `auth@v3` de demander le jeton OIDC de GitHub et de
# l'échanger contre une identité fédérée : aucune clé de compte de service dans le dépôt (AD-12).
permissions:
  contents: read
  id-token: write

# Deux déploiements simultanés se promouvraient l'un l'autre dans le désordre. On sérialise, et on
# n'annule pas celui qui est en cours : il a peut-être déjà construit une image.
concurrency:
  group: deploiement-cloud-run
  cancel-in-progress: false

jobs:
  # Le même texte que sur une pull request : rien n'est déployé qui n'ait passé le lint et la suite
  # hors ligne. Une seule définition, appelée des deux côtés.
  verifier:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      sources_reelles: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write

  deployer:
    name: Construire, sonder, promouvoir
    needs: verifier
    environment: production
    # AD-12 : « environnement unique (`main` → `foyer-retour`) ». `push` est déjà borné à `main`,
    # mais `workflow_dispatch` accepte n'importe quelle référence : c'est ici que la borne tient pour
    # les deux. Sur une autre branche, le lint et la suite tournent, et rien n'est déployé.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Le build Cloud Build tient en quelques minutes, les smokes en une. Au-delà, un appel bloqué
    # garderait le groupe `concurrency` — et une révision taguée, publique, en vol — jusqu'au plafond
    # de six heures de GitHub. Mieux vaut échouer, ce qui déclenche le nettoyage du tag ci-dessous.
    timeout-minutes: 30
    env:
      SERVICE: foyer-retour
      REGION: europe-west1
      TAG: candidat
      PROJET: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Les trois variables du dépôt sont posées par `scripts/gcp_bootstrap.sh` (story 1.0). Une
      # variable vide donne sinon un échec obscur au milieu d'un build facturé.
      #
      # **Et le projet n'est pas seulement « non vide ».** L'AC de la story écrit `project_id:
      # foyer-retour` et FR44 a exige `--project=foyer-retour` : une variable de dépôt est éditable
      # depuis l'interface de GitHub, sans revue et sans diff, et une valeur erronée ferait construire
      # et déployer ce service dans **un autre projet GCP** — celui du poste par défaut, ou n'importe
      # lequel. Le nom autoritaire est donc écrit ici, une fois, et confronté à la variable **avant**
      # l'authentification : ce qui suit interpole `vars.GCP_PROJECT_ID` ne peut plus désigner autre
      # chose (revue Codex 1.11).
      #
      # Les valeurs passent par `env:` et non par `${{ vars.X }}` écrit dans le script : une
      # interpolation est **collée dans le texte du shell avant exécution**, si bien qu'une valeur
      # portant un guillemet casserait la commande — ou l'exécuterait. Le reste du fichier le fait
      # déjà ainsi pour `URL`, `SHA7` et `REVISION` ; ici aussi.
      - name: Contrôler les variables du dépôt
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          PROJET_ATTENDU: foyer-retour
        run: |
          manquantes=()
          [ -n "$GCP_PROJECT_ID" ] || manquantes+=(GCP_PROJECT_ID)
          [ -n "$WIF_PROVIDER" ]   || manquantes+=(WIF_PROVIDER)
          [ -n "$DEPLOY_SA" ]      || manquantes+=(DEPLOY_SA)
          if [ ${#manquantes[@]} -ne 0 ]; then
            echo "variables du dépôt absentes : ${manquantes[*]} — les poser avec les sorties de scripts/gcp_bootstrap.sh" >&2
            exit 1
          fi
          if [ "$GCP_PROJECT_ID" != "$PROJET_ATTENDU" ]; then
            echo "GCP_PROJECT_ID vaut « $GCP_PROJECT_ID » : le seul projet que ce workflow déploie est « $PROJET_ATTENDU » (AC 1.11, FR44 a)" >&2
            exit 1
          fi

      # Deux formes de la **même** révision, et une seule source de vérité (story 4.5, revue B2) :
      #
      #   - `sha40` est ce que le service porte (`GIT_SHA`). Un gate `full` affirme avoir mesuré un
      #     commit précis ; le comparer à sept caractères ne discriminait que 16⁷ classes, et un
      #     gate d'un **autre** commit partageant le sha7 était servi sans alerte.
      #   - `sha7` reste ce qu'AD-11 promet à `/api/v1/sante` (`version: sha7`) et ce que le smoke
      #     compare. C'est une **projection** de la première (`Settings.version_publiee`), pas une
      #     seconde vérité.
      - name: Empreintes du commit
        id: sha
        run: |
          echo "sha40=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # **Avant `auth`, et c'est la seule raison de l'ordre.** L'installateur d'uv est un script
      # téléchargé et exécuté (`curl | sh`) : joué après l'authentification, il tournerait sur un
      # runner où `gha-creds-*.json` existe déjà, et une compromission de cette ressource lirait le
      # crédentiel fédéré du déployeur. Ici, il n'y a encore rien à voler (revue Codex 1.11). La
      # version est épinglée, et `test_uv_est_epingle_sur_la_serie_du_dockerfile_et_partout_a_la_meme_version`
      # tient cette épingle avec celle du `Dockerfile` et de `ci.yml`.
      - name: Installer uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          # L'installateur dépose `uv` dans `~/.local/bin`, que le runner n'a pas forcément sur son
          # `PATH` : le dire explicitement plutôt que de compter sur l'image.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installer les dépendances (lock gelé)
        run: uv sync --frozen

      - name: Identité fédérée (WIF direct, sans clé)
        # v3 vérifié : le SHA évite qu'un tag mutable change le courtier d'identité sans revue.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: gcloud
        uses: google-github-actions/setup-gcloud@v3

      # `env_vars_update_strategy: overwrite` fait de ce fichier l'**autorité** sur la configuration
      # du service : un `ALLOW_UNGATED=true` posé à la main sur le service ne survit pas au
      # déploiement suivant (reprise différée de 1.10), et le smoke refuse d'ailleurs de promouvoir
      # tant que l'alerte `ungated_refuse_en_production` est là. `ENV=prod` et `PORT` viennent du
      # `Dockerfile` et ne sont pas des variables de service : `overwrite` ne les touche pas.
      # Même raisonnement pour les secrets : la version est **épinglée ici** (`:1`), pas héritée.
      #
      # `wait: true` est posé parce qu'AD-12 l'écrit. L'action le documente comme n'ayant d'effet que
      # sur les *jobs* ; pour un service, la synchronicité vient de `gcloud run deploy` lui-même, qui
      # attend que la révision soit prête. La ligne reste, littéralement conforme au spine.
      - name: Déployer sans trafic, sous le tag candidat
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          source: .
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ env.REGION }}
          no_traffic: true
          tag: ${{ env.TAG }}
          env_vars: |-
            GIT_SHA=${{ steps.sha.outputs.sha40 }}
          env_vars_update_strategy: overwrite
          secrets: |-
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:1
          secrets_update_strategy: overwrite
          # AD-13, et les six valeurs de dimensionnement ont ici leur **autorité** : ce sont des
          # drapeaux d'infrastructure, pas des seuils de `config.py` (qui configure le processus).
          # Le passage à 2 instances et 8 requêtes concurrentes n'aura lieu qu'après un test
          # mémoire/latence, et le README porte cette règle.
          #
          # `--memory=1Gi` : sans lui, Cloud Run sert **512 Mio**, et le README reconnaissait déjà
          # que deux requêtes de pipeline concurrentes avec PyMuPDF chargé n'y tiennent pas — alors
          # que le service sert précisément deux requêtes de front. La limite était documentée et
          # non corrigée : un dépassement mémoire tue l'instance, et Cloud Run rend un 503 que rien
          # dans la trace n'explique. Le drapeau est ici parce que c'est ici qu'il décide.
          flags: >-
            --allow-unauthenticated
            --max-instances=1
            --concurrency=2
            --timeout=120
            --min-instances=0
            --memory=1Gi
            --service-account=foyer-retour-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          wait: true

      # **`steps.deploy.outputs.url` est l'URL taguée**, et c'est elle que le smoke sonde (AC 1.11,
      # AD-12). L'action rend `status.url` — l'URL du **service** — *sauf* quand l'entrée `tag` est
      # posée : son analyseur cherche alors `status.traffic[]` à l'entrée portant ce tag et publie
      # son `url` (`src/output-parser.ts`, `parseDeployResponse`, v3). Le commentaire précédent
      # affirmait l'inverse et faisait sonder une URL résolue à part : la sortie de l'action est
      # autoritaire, on la prend (revue Codex 1.11).
      #
      # Ce que cette étape apporte encore, et qui n'a pas de sortie d'action : le **nom** de la
      # révision candidate, sans lequel la promotion ne pourrait que dire « la dernière créée ». Elle
      # le lit dans la même entrée de `status.traffic[]` que l'URL — et **confronte** cette URL à
      # celle que l'action a publiée. Les deux d'accord, la révision promue est exactement celle que
      # le smoke a sondée ; en désaccord, quelque chose a re-tagué le service entre les deux appels et
      # rien ne doit être promu.
      - name: Résoudre la révision candidate et confronter son URL à celle de l'action
        id: candidate
        env:
          URL_ACTION: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$URL_ACTION" ]; then
            echo "l'action de déploiement n'a publié aucune URL : la révision candidate n'est pas adressable, rien ne sera promu" >&2
            exit 1
          fi
          entree="$(gcloud run services describe "$SERVICE" \
                      --region="$REGION" --project="$PROJET" --format=json \
                    | jq -c --arg tag "$TAG" 'first(.status.traffic[]? | select(.tag == $tag))')"
          url="$(jq -r '.url // empty' <<<"$entree")"
          revision="$(jq -r '.revisionName // empty' <<<"$entree")"
          if [ -z "$url" ] || [ -z "$revision" ]; then
            echo "aucune entrée de trafic pour le tag $TAG : la révision candidate n'est pas adressable, rien ne sera promu" >&2
            exit 1
          fi
          if [ "$url" != "$URL_ACTION" ]; then
            echo "l'URL taguée du service ($url) n'est pas celle que l'action a déployée ($URL_ACTION) : le smoke et la promotion ne parleraient pas de la même révision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "révision candidate : $revision → $url"

      # Les smokes d'AD-12, sur la révision candidate. Un écart ⇒ sortie 1 ⇒ le workflow échoue
      # **avant** `update-traffic`, et l'ancienne révision garde 100 % du trafic (AD-16 : jamais de
      # promotion « quand même », jamais de valeur de repli).
      - name: Smoke tests sur la révision candidate
        run: uv run python scripts/smoke.py --base-url "$URL" --version "$SHA7"
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA7: ${{ steps.sha.outputs.sha7 }}

      # Seulement maintenant, et **nommément**. `--to-latest` promeut « la dernière révision créée »,
      # qui n'est pas forcément celle qu'on vient de sonder : un `gcloud run deploy` lancé à la main
      # pendant le smoke aurait reçu 100 % du trafic sans avoir jamais été vérifié — exactement la
      # promotion « quand même » qu'AD-16 interdit. On promeut la révision dont le smoke a lu la
      # santé, la version et les deux cas témoins. Le tag est retiré dans le même appel : il ne
      # désigne une révision que le temps de la sonder.
      - name: Promouvoir la révision sondée et retirer le tag
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions="$REVISION=100" --remove-tags="$TAG" \
            --region="$REGION" --project="$PROJET"
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}

      # Le smoke est rouge (ou le job a échoué autrement) : la révision refusée reste sinon taguée
      # `candidat`, donc **publiquement joignable** (`--allow-unauthenticated`) avec le secret
      # Anthropic monté, jusqu'au prochain déploiement réussi. On retire le tag ; `|| true` parce que
      # ce nettoyage ne doit jamais devenir la cause d'échec affichée à la place de la vraie.
      #
      # `cancelled()` autant que `failure()` : une annulation à la main, ou le plafond
      # `timeout-minutes` atteint pendant les 40 s du smoke, laisse exactement la même révision non
      # validée en vol. `failure()` seul ne s'y déclenche pas — c'est le cas que le paragraphe
      # ci-dessus décrit, et il était le seul à ne pas être couvert (revue 1.11).
      - name: Retirer le tag de la révision refusée
        if: failure() || cancelled()
        run: |
          gcloud run services update-traffic "$SERVICE" --remove-tags="$TAG" \
            --region="$REGION" --project="$PROJET" || \
            echo "tag $TAG non retiré : le retirer à la main (la cause d'échec est plus haut)" >&2

      - name: Résumé
        run: |
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJET" \
                 --format='value(status.url)')"
          {
            echo "### Déployé : \`${{ steps.candidate.outputs.revision }}\` (version ${{ steps.sha.outputs.sha7 }})"
            echo ""
            echo "- URL : $url"
            echo "- Retour arrière : \`gcloud run services update-traffic $SERVICE --to-revisions=<révision>=100 --region=$REGION --project=$PROJET\`"
          } >> "$GITHUB_STEP_SUMMARY"
