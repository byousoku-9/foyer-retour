# Plancher pré-enregistré des évals (story 4.2b) — le protocole précède toute mesure.
#
# Ce fichier est figé par digest : `server/evals/plancher.py` le charge, en calcule l'empreinte
# SHA-256, et le runner l'inscrit dans l'identité de chaque run (`identity.image.plancher_digest`).
# Deux runs ne se comparent qu'à digest égal. Abaisser un seuil ou retirer un témoin est un
# changement de protocole : il se voit, il ne se glisse pas.
#
# Sources importées **sans diminution** (la section `imports` en recopie les valeurs ; le chargeur
# refuse tout témoin dont le plancher descend sous elles) :
# - floor 4.2a : automation/runs/20260827-181634-story-4.2a/control/floor.yaml (dépôt parent) ;
# - règle trusted : automation/plancher.yaml (dépôt parent, schema_version 2).
schema_version: 1
story: "4.2b"
effective_from: "2026-08-28"

# Le producteur de preuve est l'orchestrateur : un run lancé par le builder est un diagnostic,
# jamais une preuve (règle trusted). Le refus de budget est un rouge chiffré, jamais une question.
producer_de_preuve: orchestrator
n_minimum: 3

splits:
  A:
    role: developpement
    localisation: "server/evals/cases/"
    publie: true
  B:
    role: holdout
    localisation: "~/foyer-retour-holdout/B/"
    lecture_builder: interdit
    materialisation_builder: interdit
    verdicts_par_candidat: 1
  C:
    role: reserve
    execution: interdite

budget:
  environment_variable: LIVE_BUDGET_EUR
  default_eur: 1.00
  enforced_by:
    - anthropic_client
    - eval_runner
    - campaign_ledger
  on_exceeded:
    status: red
    report:
      - configured_budget_eur
      - accrued_cost_eur
      - refused_cost_eur
    ask_first: false

series:
  baseline_per_named_witness: 1
  final_per_named_witness: 1
  repeat_required: true
  max_cost_required: true
  max_repeat: 1000

quality_closure:
  schema_version: 1
  row_ids:
    - P-01
    - P-02
    - A-01
    - A-02
    - A-03
    - A-04
    - A-05
    - T-01
    - T-02
    - T-03
    - R-01
    - R-02
    - R-03
    - R-04
    - R-05
    - R-06
    - R-07
    - R-08
    - R-09
    - R-10
    - R-11
    - M-01
    - M-02
    - O-01
    - O-02
    - V-01
    - V-02
    - V-03
    - V-04
    - V-05
  v05_dependencies:
    - P-01
    - P-02
    - A-01
    - A-02
    - A-03
    - A-04
    - A-05
    - T-01
    - T-02
    - T-03
    - R-01
    - R-02
    - R-03
    - R-04
    - R-05
    - R-06
    - R-07
    - R-08
    - R-09
    - R-10
    - R-11
    - M-01
    - M-02
    - O-01
    - O-02
    - V-01
    - V-02
    - V-03
    - V-04
  missing_artifact: OPEN

regles_incident:
  - "toute repetition manquante d'un run interrompu est rouge et reste au denominateur"
  - "aucun_admissible est un resultat rouge, jamais un incident a retirer du denominateur"
  - "un refus de budget est un rouge chiffre (configured_budget_eur, accrued_cost_eur, refused_cost_eur), sans question humaine"

imports:
  floor_4_2a:
    source: "automation/runs/20260827-181634-story-4.2a/control/floor.yaml"
    snapshot: "floor-4.2a.yaml"
    snapshot_digest: "c324e188682d486281515f71d43da39dab5c3f1ead68f66c0c77dddca4c3dc55"
    n_minimum: 3
    thresholds:
      offline_tests_pass_rate: 1.0
      bougie_post_success_rate: 1.0
      a16_post_success_rate: 1.0
      decision_claim_rate: 1.0
  regle_trusted:
    source: "automation/plancher.yaml"
    snapshot: "trusted-automation-plancher.yaml"
    snapshot_digest: "d19003ddb3a4a934b21cba1b5b745de439ec327b2a3444f2428fb1ed95235f5c"
    schema_version: 2
    proof_producer: orchestrator
    baseline_per_named_witness: 1
    final_per_named_witness: 1
    live_budget_default_eur: 1.00

temoins:
  - metric: offline_tests_pass_rate
    pipeline: harness
    famille: tests_hors_ligne
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "commandes pytest hors reseau vertes"
    denominateur: "commandes pytest lancees, interruptions comprises"
    incident: "une suite interrompue compte rouge au denominateur"
    scope: repo
    mesure_par: orchestrator
    note: "amorcage apres reingestion (2026-09-02) : une reingestion retire le gate du document, et les temoins marques `etat_servi` (pytest -m etat_servi : gates presents et verts dans le manifest committe) sont alors rouges par construction, ce qui rendrait tout gate vert impossible. Pendant ce seul cycle, les trois commandes pytest de la preuve excluent ce marqueur (-m 'not etat_servi') ; la revision qui commit les gates verts doit ensuite passer la suite entiere sans exclusion, ce que la CI verifie. Aucune autre exclusion n'est admise."
  - metric: bougie_post_success_rate
    pipeline: sinistre
    famille: temoin_nomme
    criticite: bloquant
    plancher: 1.0
    n: 3
    case_id: s-bougie-canape
    numerateur: "repetitions ok (label et attentes tenus)"
    denominateur: "repetitions planifiees, interruptions comprises"
    incident: "repetition manquante = rouge au denominateur"
    scope: case
    mesure_par: eval_runner
  - metric: a16_post_success_rate
    pipeline: sinistre
    famille: temoin_nomme
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "reponses HTTP 200 conformes du temoin A16 (POST /api/v1/sinistre)"
    denominateur: "requetes planifiees, interruptions comprises"
    incident: "requete interrompue = rouge au denominateur"
    scope: live_http
    mesure_par: orchestrator
    note: "actuellement 0/3 (story 4.2a) : rouge, publie tel quel, jamais retire du plancher"
  - metric: decision_claim_rate
    pipeline: sinistre
    famille: temoin_nomme
    criticite: bloquant
    plancher: 1.0
    n: 3
    case_id: s-bougie-canape
    numerateur: "repetitions dont la reponse porte la claim decisionnelle attendue (predicat 4.2a)"
    denominateur: "repetitions planifiees, interruptions comprises"
    incident: "repetition manquante = rouge au denominateur"
    scope: case
    mesure_par: orchestrator
    note: "le predicat est fusionne dans juger (chaque repetition d'un cas expected.decision_claim le juge) ; la serie chiffree du gate reste mesuree par la serie orchestrateur"
  - metric: stabilite_sinistre
    pipeline: sinistre
    famille: stabilite
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "cas dont chacune des N repetitions porte les block_id de l'oracle expected du cas parmi ses claims retenues, rend un verdict admissible identique entre repetitions, et n'a pas ete interrompue"
    denominateur: "cas sinistre repetes, interruptions comprises"
    incident: "repetition manquante, preuve attendue absente d'une repetition, ou verdict divergent = cas instable, rouge"
    scope: suite
    mesure_par: eval_runner
    note: "re-derive le 2026-09-03 (story 5.6 T12). Ancien numerateur, ecrit en 4.2b : « cas dont les N repetitions rendent la meme preuve {doc_id, block_id, kind, quote_hash} et le meme verdict admissible ». Il supposait la retrouvaille deterministe d'avant l'amendement AD-1 du 03/09/2026 : le code choisissait les blocs, l'ensemble des citations etait une propriete du corpus. Depuis, le modele navigue et choisit ses citations ; les clauses decisives reviennent, les extraits auxiliaires et les bornes de « la plus courte quote contigue » varient. Le hachage de citation sort du numerateur parce qu'AD-3 verifie deja chaque citation au caractere pres : sa borne est un choix du modele, sa fidelite n'en est pas un. La propriete utile n'est pas affaiblie : l'exigence de preuve devient une exigence PAR repetition (une seule repetition qui perd une clause de l'oracle rougit le cas, la ou une comparaison entre repetitions aurait declare trois pertes identiques stables), le verdict reste admissible ET identique entre repetitions, et toute interruption reste rouge. Un cas sans oracle de preuve est juge sur le verdict et l'absence d'interruption. Le plancher reste 1.0 ; le plancher_digest change, donc ce temoin ne se compare pas d'avant a apres."
  - metric: stabilite_guide
    pipeline: guide
    famille: stabilite
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "cas dont chacune des N repetitions porte les identifiants de l'oracle expected du cas (block_ids parmi les blocs cites, fiche_ids parmi les fiches citees), rend le meme statut/found/complete/label entre repetitions, et n'a pas ete interrompue"
    denominateur: "cas guide repetes, interruptions comprises"
    incident: "repetition manquante, preuve attendue absente d'une repetition, ou statut divergent = cas instable, rouge"
    scope: suite
    mesure_par: eval_runner
    note: "re-derive le 2026-09-03 (story 5.6 T12), pour la meme cause que stabilite_sinistre et sous la meme regle. Ancien numerateur, ecrit en 4.2b : « cas dont les N repetitions rendent le meme statut, found/complete, label et ensemble de fiches ». L'amendement AD-1 porte le guide comme le sinistre — un seul chemin de production —, donc l'ensemble des fiches citees est desormais un choix du modele et non une propriete du corpus. Il sort de la comparaison entre repetitions et entre dans l'exigence PAR repetition : les fiche_ids/block_ids de l'oracle doivent etre cites a chaque repetition. Le statut reste compare a l'identique. Le plancher reste 1.0 ; le plancher_digest change."
  - metric: cases_ok_rate
    pipeline: all
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions ok (cas x repetition, label et attentes tenus)"
    denominateur: "executions planifiees (cas x repetitions), interruptions comprises"
    incident: "execution manquante = rouge au denominateur"
    scope: run
    mesure_par: eval_runner
  - metric: executions_completes
    pipeline: all
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions terminees"
    denominateur: "executions planifiees (cas x repetitions)"
    incident: "toute execution manquante est rouge : un run interrompu ne devient jamais vert"
    scope: run
    mesure_par: eval_runner

  # --- story 4.5 : les dix temoins du gate `full` -------------------------------------------------
  #
  # Ils s'ajoutent **sans** toucher aux huit precedents et sans diminuer un import : ce sont des
  # exigences nouvelles, pas un abaissement. `arme_par: gate_full` dit a quel moment ils sont
  # applicables — un gate `--gate {doc_id} --profile full`, et lui seul. La CI lance `--profile full`
  # sans `--gate` (diagnostic) et les gates `vertical` n'affirment que deux cas relus : leur imposer
  # la politique complete rendrait rouge une mesure qui ne la revendique pas.
  #
  # Chaque temoin est **bloquant** a plancher 1.0 : le mecanisme de fermeture par vacuite de
  # `construire_decisions` rend rouge tout temoin bloquant applicable qu'un run n'a pas emis. Une
  # preuve absente est donc rouge sans une ligne de code de plus.
  - metric: parsing_ok_rate
    pipeline: parsing
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions parsing ok (texte normalise du bloc identique a la lecture visuelle)"
    denominateur: "executions parsing planifiees (cas parsing x repetitions), interruptions comprises"
    incident: "execution parsing manquante = rouge au denominateur"
    scope: suite
    mesure_par: eval_runner
    arme_par: gate_full
    note: "sous --gate {doc_id} --profile full, la suite parsing du document entre dans le lot"
  - metric: blocs_attendus_ouverts_rate
    pipeline: all
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions dont tous les expected_block_ids sont dans opened_block_ids"
    denominateur: "executions planifiees (cas x repetitions), interruptions comprises"
    incident: "execution manquante = rouge au denominateur"
    scope: run
    mesure_par: eval_runner
    arme_par: gate_full
  - metric: citations_retrouvees_rate
    pipeline: all
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions dont le label n'est pas citation_introuvable"
    denominateur: "executions planifiees (cas x repetitions), interruptions comprises"
    incident: "execution manquante = rouge au denominateur"
    scope: run
    mesure_par: eval_runner
    arme_par: gate_full
    note: "compte meme lorsque mode_attendu prevoyait citation_introuvable : le gate full mesure le systeme, pas l'attente du cas"
  - metric: zero_5xx_technique_rate
    pipeline: all
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions dont le statut AD-16 est absent ou < 500"
    denominateur: "executions planifiees (cas x repetitions), interruptions comprises"
    incident: "execution manquante ou interrompue sur 5xx = rouge au denominateur"
    scope: run
    mesure_par: eval_runner
    arme_par: gate_full
  - metric: typage_confirme_rate
    pipeline: sinistre
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions sinistre dont chaque preuve citant une clause fondatrice (garantie, exclusion) porte un kind confirme (manual ou model_verified)"
    denominateur: "executions sinistre planifiees (cas sinistre x repetitions), interruptions comprises"
    incident: "execution sinistre manquante = rouge au denominateur"
    scope: suite
    mesure_par: eval_runner
    arme_par: gate_full
    note: "le typage qu'AD-6 exige est celui des clauses fondatrices, l'univers exact du predicat decisionnel ; le guide n'a aucune clause juridique a typer et sa preuve equivalente est citations_retrouvees_rate + blocs_attendus_ouverts_rate"
  - metric: structure_prouvee_rate
    pipeline: parsing
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "documents PDF du lot dont structure.json est declare au manifest, present, concordant, et dont le rapport d'ingestion porte une attestation structure_proposee affirmative rattachee a ce document (document_hash et structure_hash observes)"
    denominateur: "documents du lot issus d'un PDF (regle SOURCE_FILES du loader)"
    incident: "artefact de structure absent, illisible, ou attestation absente = rouge, jamais neutre"
    scope: suite
    mesure_par: eval_runner
    arme_par: gate_full
    note: "un document non issu d'un PDF (copie de site) n'a aucune proposition de structure a prouver : il sort du denominateur, et c'est arbre_prouve_rate qui lui oppose la preuve deterministe dont son ingestion dispose ; le temoin n'est applicable que lorsque le lot porte une suite parsing, ce qu'un gate full sur un document PDF garantit. Actuellement 0/1 : aucune structure.json sur le corpus servi (reingestion reelle due a l'orchestrateur) — rouge, publie tel quel"
  - metric: arbre_prouve_rate
    pipeline: guide
    famille: run
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "documents non issus d'un PDF dont le rapport d'ingestion porte un check invariants_arbre affirmatif (jamais bloquant) dont l'attestation nomme le document_hash et l'ingest_fingerprint de l'entree du manifest"
    denominateur: "documents du lot qui ne sont pas issus d'un PDF (regle SOURCE_FILES du loader), c'est-a-dire le complement exact du denominateur de structure_prouvee_rate"
    incident: "rapport d'ingestion absent, illisible, etranger, sans attestation ou attestant un autre arbre = rouge, jamais neutre"
    scope: suite
    mesure_par: eval_runner
    arme_par: gate_full
    note: "pendant de structure_prouvee_rate pour le perimetre guide : la story 4.2c ne s'applique pas a une copie de site, mais son ingestion emet le meme controle deterministe d'arbre (invariants_arbre) que l'ingestion PDF. Restreindre structure_prouvee_rate aux PDF sans donner cette preuve au guide aurait laisse un perimetre entier sans exigence de structure — un abaissement du plancher par omission. Le partage des deux denominateurs est la regle SOURCE_FILES, jamais un doc_id. Actuellement 0/1 : le report.json servi porte invariants_arbre sans empreinte (forme anterieure a 4.5) — rouge tant que le guide n'est pas reingere"
  - metric: stabilite_claim_decisionnelle
    pipeline: sinistre
    famille: stabilite
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "cas sinistre dont les N repetitions rendent le meme predicat decision_claim"
    denominateur: "cas sinistre repetes, interruptions comprises"
    incident: "repetition manquante ou predicat divergent = cas instable, rouge"
    scope: suite
    mesure_par: eval_runner
    arme_par: gate_full
    note: "temoin distinct de stabilite_sinistre, dont le numerateur reste fige au plancher importe"
  - metric: anti_rustine_pass_rate
    pipeline: harness
    famille: tests_hors_ligne
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions de la garde anti-rustine vertes"
    denominateur: "executions planifiees de la garde, interruptions comprises"
    incident: "une garde interrompue compte rouge au denominateur"
    scope: repo
    mesure_par: orchestrator
    arme_par: gate_full
  - metric: metamorphique_pass_rate
    pipeline: harness
    famille: tests_hors_ligne
    criticite: bloquant
    plancher: 1.0
    n: 3
    numerateur: "executions de la garde metamorphique vertes"
    denominateur: "executions planifiees de la garde, interruptions comprises"
    incident: "une garde interrompue compte rouge au denominateur"
    scope: repo
    mesure_par: orchestrator
    arme_par: gate_full
